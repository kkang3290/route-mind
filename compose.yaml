name: route-mind-dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: route_mind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/dev-init.sql:/docker-entrypoint-initdb.d/10-route-mind.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d route_mind"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    # Optional, disposable HOST-LOOPBACK development service, not production HA.
    # Container-to-container Gateway connections require verified Redis TLS.
    profiles: [redis]
    image: redis:7.4.8-alpine
    ports: ["127.0.0.1:56379:6379"]
    mem_limit: 128m
    command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 64mb, --maxmemory-policy, noeviction]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 3s
      retries: 20
  migrate:
    profiles: [ops]
    build: {context: ., target: migration}
    environment:
      MIGRATION_DATABASE_URL: postgres://route_mind_migrator:${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}@postgres:5432/route_mind?sslmode=disable
      DATABASE_SCHEMA: public
      APP_ENV: development
    depends_on:
      postgres: {condition: service_healthy}
    command: [up]
  db-grant:
    profiles: [ops]
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGDATABASE: route_mind
      PGUSER: route_mind_migrator
      PGPASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD}
    volumes: ["./deploy/dev-grants.sql:/work/grants.sql:ro"]
    command: [psql, -v, ON_ERROR_STOP=1, -f, /work/grants.sql]
    depends_on:
      postgres: {condition: service_healthy}
  app:
    profiles: [app]
    build: {context: ., target: runtime}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./configs/providers.example.yaml:/app/config.yaml:ro"]
    environment:
      APP_ENV: development
      # Edit the mounted YAML to allow insecure DEVELOPMENT DB transport, or
      # configure verified PostgreSQL TLS. The example fails closed by default.
      DATABASE_URL: postgres://route_mind_app:${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD}@postgres:5432/route_mind?sslmode=disable
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:?set GATEWAY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  postgres-data:
