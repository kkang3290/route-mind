# Offline Redis multi-instance demo; no real/paid Provider calls.
# Start PostgreSQL/migrations as in README, then:
# docker compose --profile redis up -d --wait redis
# REDIS_URL=redis://127.0.0.1:56379/0 bin/route-mind -conf configs/redis.example.yaml
# For a second instance copy this file and change ONLY server.address to :8001.
# Both instances require the same namespace/policy. See docs/multi-instance.md.
server:
  address: 127.0.0.1:8000
  request_seconds: 180
  write_seconds: 15
  max_concurrent: 32
  per_principal_concurrent: 4
  rate_per_minute: 60
  burst: 10
coordination:
  mode: redis
  namespace: route-mind-dev-v1
  url_env: REDIS_URL
  allow_insecure_local: true # Literal loopback only; forbidden in production.
  max_connections: 32
  dial_timeout_ms: 1000
  operation_timeout_ms: 500
  lease_ttl_ms: 30000
  renew_interval_ms: 10000
gateway:
  max_concurrent: 32
  provider_concurrent: 8
  retries: 1 # Explicit 0 disables retry.
  circuit_failures: 5 # Explicit 0 disables health breaking, not concurrency.
  circuit_cooldown_seconds: 15
principals:
  - id: local-user
    key_env: GATEWAY_API_KEY
    allow_agent: true
    models: [small, strong]
    providers: [mock-openai, mock-anthropic]
    server_tools: [sum, lookup]
providers:
  - {id: mock-openai, format: openai, base_url: http://127.0.0.1:18081/v1, key_env: MOCK_API_KEY, allow_http: true}
  - {id: mock-anthropic, format: anthropic, base_url: http://127.0.0.1:18081/v1, key_env: MOCK_API_KEY, allow_http: true}
models:
  - {id: decision, provider: mock-openai, upstream: mock-decision, max_input_bytes: 262144, max_output_tokens: 4096}
  - {id: small, provider: mock-openai, upstream: mock-small, max_input_bytes: 131072, max_output_tokens: 4096, stream: true, tools: true, forced_tools: true, cost_rank: 1, quality_tier: 1}
  - {id: strong, provider: mock-anthropic, upstream: mock-strong, max_input_bytes: 262144, max_output_tokens: 4096, stream: true, tools: true, forced_tools: true, cost_rank: 10, quality_tier: 3}
agent:
  decision_model: decision
  models: [small, strong]
  providers: [mock-openai, mock-anthropic]
database:
  url_env: DATABASE_URL
  schema: public
  allow_insecure: true # Development only; production requires verify-full.
  max_connections: 16
  max_runs: 4096
  max_runs_per_principal: 128
