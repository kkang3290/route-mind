name: Go and PostgreSQL
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: route_mind_test
          POSTGRES_PASSWORD: ci-disposable-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d route_mind_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-disposable-only@127.0.0.1:5432/route_mind_test?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {fetch-depth: 0}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with: {go-version: '1.26.11', cache: true}
      - run: go mod verify
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: make test race vet build
      - run: make integration
      - name: Real binary, curl, and process-restart smoke (local mock only)
        run: |
          MIGRATION_DATABASE_URL="$TEST_DATABASE_URL" go run ./cmd/migrate up
          python3 -I scripts/smoke.py
      - name: Verify migration contents and immutable history
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$PUSH_BASE"; fi
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ]; then
            base="$(git rev-list --max-parents=0 HEAD)"
          fi
          make migration-verify BASE_REF="$base"
      - run: make vuln
      - name: Build separate application and migration images
        run: |
          docker build --target runtime -t route-mind:ci .
          docker build --target migration -t route-mind-migrate:ci .
